name: Ultimate CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0' # Weekly security scan

env:
  NODE_VERSION: '22.x'

jobs:
  validate:
    name: 🔍 Code Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install Dependencies
        run: |
          npm install
          npm rebuild sharp
      
      - name: TypeScript Check
        run: npm run build --if-present
      
      - name: ESLint Check
        run: npm run lint --if-present || echo "No lint script defined"
      
      - name: Dependency Audit
        run: npm audit --production

  test:
    name: 🧪 Cross-Platform Tests
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18.x', '20.x']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      
      - name: Install Dependencies
        run: |
          npm install
          npm rebuild sharp
      
      - name: Build Project
        run: npm run build --if-present
      
      - name: Run Tests
        run: npm test --if-present
        continue-on-error: true

  build:
    name: 📦 Build Application
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Dependencies
        run: |
          npm install
          npm rebuild sharp
      
      - name: Build App
        run: npm run dist --if-present
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Loop-${{ matrix.os }}-build
          path: |
            release/
            dist/
            dist-electron/
          if-no-files-found: ignore

  security:
    name: 🔒 Security Scanning
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: npm Audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  deploy:
    name: 🚀 Deploy
    needs: [build, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: "Release v${{ github.run_number }}"
          draft: false
          prerelease: false

  monitor:
    name: 📊 Monitor Workflow
    needs: [test, build, security, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Status
        run: |
          echo "## 📊 CI/CD Workflow Status" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.build.result }}" = "success" ] && \
             [ "${{ needs.security.result }}" = "success" ]; then
            echo "✅ **All checks passed!**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test.result }}" = "skipped" ] && \
             [ "${{ needs.build.result }}" = "skipped" ] && \
             [ "${{ needs.security.result }}" = "skipped" ]; then
            echo "⚠️ **All jobs were skipped (dependency check failed)**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some checks failed. Please investigate.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
